onboarding = false

[keys]
goto               = "prefix+t"
switch_tab         = "ctrl+alt+1..9"
previous_tab       = "ctrl+alt+left"
next_tab           = "ctrl+alt+right"
previous_workspace = "ctrl+alt+up"
next_workspace     = "ctrl+alt+down"
focus_pane_up      = "ctrl+shift+up"
focus_pane_down    = "ctrl+shift+down"
focus_pane_left    = "ctrl+shift+left"
focus_pane_right   = "ctrl+shift+right"

[[keys.command]]
key         = "prefix+g"
command     = "lazygit"
type        = "popup"
description = "lazygit"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "prefix+y"
command     = "yazi"
type        = "popup"
description = "yazi"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "prefix+enter"
command     = "zsh"
type        = "popup"
description = "terminal"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "prefix+p"
command     = "gh-dash"
type        = "popup"
description = "gh-dash"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "prefix+h"
command     = "bash -lc 'r=$(herdr tab create --label \"hunk diff\" --no-focus); p=$(printf \"%s\" \"$r\" | jq -r \".result.root_pane.pane_id\"); t=$(printf \"%s\" \"$r\" | jq -r \".result.tab.tab_id\"); herdr pane run \"$p\" \"mise exec -- hunk diff; herdr tab close $t\"; herdr tab focus \"$t\"'"
type        = "shell"
description = "hunk diff"

[[keys.command]]
key         = "ctrl+alt+g"
command     = "zsh -ic 'nvim +Git!'"
type        = "popup"
description = "git panel"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "ctrl+alt+e"
command     = "zsh -ic 'nvim +Explorer!'"
type        = "popup"
description = "explorer"
width       = "90%"
height      = "90%"

[[keys.command]]
key         = "ctrl+alt+t"
command     = "zsh"
type        = "popup"
description = "terminal"
width       = "90%"
height      = "90%"

[worktrees]
directory = "/app/.tmp/worktree"

[experimental]
kitty_graphics = true

[theme]
name = "catppuccin"
