[tools]
"npm:markdownlint-cli2"      = "0.21.0"
"hk" = "1.40.0"
# CLIヘルパーツール
"aqua:jqlang/jq"             = "1.8.1"   # JSON処理（GitHub Actions / スクリプト / taskfiles で使用）
"aqua:mikefarah/yq"          = "4.49.2"  # YAML処理（taskfiles で使用）
"aqua:tamasfe/taplo"         = "0.10.0"  # TOML処理（taskfiles で使用）
"aqua:junegunn/fzf"          = "0.67.0"  # ファジーファインダー（taskfiles/args.yml, monitoring.yml 等で使用）
"aqua:sharkdp/fd"            = "10.3.0"  # 高速ファイル検索（taskfiles/args.yml で使用）
"aqua:sharkdp/bat"           = "0.26.1"  # シンタックスハイライト付き cat（対話利用）
"aqua:BurntSushi/ripgrep"    = "15.1.0"  # 高速 grep（taskfiles/args.yml で使用）
"aqua:dandavison/delta"      = "0.18.2"  # git diff の見やすく表示（対話利用）
"aqua:ajeetdsouza/zoxide"    = "0.9.9"   # cd コマンドを強化
"aqua:sxyazi/yazi"           = "26.1.22" # ファイルマネージャー（対話利用）
"aqua:jesseduffield/lazygit" = "0.60.0"  # Git 操作ツール
"aqua:neovim/neovim"         = "0.12.4"
"aqua:ogulcancelik/herdr"    = "0.7.4"
"npm:hunkdiff"               = "0.17.1"
# AI
"npm:@openai/codex" = "0.144.4"
"npm:@anthropic-ai/claude-code" = "2.1.101"
"npm:@google/gemini-cli"      = "0.34.0"
# Go
"go"                                                  = "1.25.8"
"go:golang.org/x/tools/gopls"                         = "0.20.0"
"go:golang.org/x/vuln/cmd/govulncheck"                = "1.1.4"
"aqua:golangci/golangci-lint"                         = "2.5.0"
# Node.js
"node"                           = "24.14.1"
"bun"                            = "1.3.10"               # mise の npm: ツールのインストールで利用している
"npm:typescript"                 = "5.9.3"
"npm:@typescript/native-preview" = "7.0.0-dev.20260318.1"
"npm:@biomejs/biome"             = "2.4.8"
"npm:eas-cli" = "18.4.0"
# Python
"python" = "3.14.6"
"uv"     = "0.7.6" # mise の pipx: ツールのインストールで利用している
# GitHub Actions
"aqua:nektos/act"              = "0.2.84"
"aqua:rhysd/actionlint"        = "1.7.11"
"aqua:suzuki-shunsuke/ghalint" = "1.5.5"
"aqua:suzuki-shunsuke/pinact"  = "3.4.5"
# ShellScript
"aqua:mvdan/sh"            = "3.13.0" # shfmtに相当する
"aqua:koalaman/shellcheck" = "0.11.0"
# microCMS
"npm:microcms-mcp-server"          = "0.8.0"

[settings]
jobs         = 20
experimental = true
lockfile     = true

[settings.node]
gpg_verify = false

[settings.npm]
bun = true

[settings.pipx]
uvx = true

[env]
NPM_CONFIG_REGISTRY = "https://npm.flatt.tech"
PIP_INDEX_URL       = "https://pypi.flatt.tech/simple/"
UV_INDEX_URL        = "https://pypi.flatt.tech/simple/"
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"
CLAUDE_CODE_NO_FLICKER = "1"
EDITOR = "nvim"
