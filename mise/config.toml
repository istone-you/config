[tools]
"hk" = "1.51.0"
# CLIヘルパーツール
"aqua:jqlang/jq"             = "1.8.2"   # JSON処理（GitHub Actions / スクリプト / taskfiles で使用）
"aqua:mikefarah/yq"          = "4.53.3"  # YAML処理（taskfiles で使用）
"aqua:tamasfe/taplo"         = "0.10.0"  # TOML処理（taskfiles で使用）
"aqua:junegunn/fzf"          = "0.74.1"  # ファジーファインダー（taskfiles/args.yml, monitoring.yml 等で使用）
"aqua:sharkdp/fd"            = "10.4.2"  # 高速ファイル検索（taskfiles/args.yml で使用）
"aqua:sharkdp/bat"           = "0.26.1"  # シンタックスハイライト付き cat（対話利用）
"aqua:BurntSushi/ripgrep"    = "15.2.0"  # 高速 grep（taskfiles/args.yml で使用）
"aqua:dandavison/delta"      = "0.19.2"  # git diff の見やすく表示（対話利用）
"aqua:ajeetdsouza/zoxide"    = "0.10.0"   # cd コマンドを強化
"aqua:sxyazi/yazi"           = "26.5.6" # ファイルマネージャー（対話利用）
"aqua:jesseduffield/lazygit" = "0.63.1"  # Git 操作ツール
"aqua:neovim/neovim"         = "0.12.4"
"aqua:ogulcancelik/herdr"    = "0.7.4"
"npm:hunkdiff"               = "0.17.1"
"aqua:dlvhdr/gh-dash"        = "4.25.2"
# AI
"npm:@openai/codex"             = "0.144.6"
"npm:@anthropic-ai/claude-code" = "2.1.214"
"npm:@google/gemini-cli"        = "0.34.0"
# Go
"go"                                   = "1.25.12"
"go:golang.org/x/tools/gopls"          = "0.23.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.1.4"
"aqua:golangci/golangci-lint"          = "2.12.2"
# Node.js
"node"                           = "24.18.0"
"bun"                            = "1.3.14"               # mise の npm: ツールのインストールで利用している
"npm:typescript"                 = "5.9.3"
"npm:@typescript/native-preview" = "7.0.0-dev.20260318.1"
"npm:@biomejs/biome"             = "2.5.4"
"npm:eas-cli"                    = "18.4.0"
# Python
"python" = "3.14.6"
"uv"     = "0.11.29" # mise の pipx: ツールのインストールで利用している
# GitHub Actions
"aqua:rhysd/actionlint"        = "1.7.11"
"aqua:suzuki-shunsuke/ghalint" = "1.5.5"
"aqua:zizmorcore/zizmor"       = "1.27.0"
"aqua:suzuki-shunsuke/pinact"  = "3.4.5"
# ShellScript
"aqua:mvdan/sh"            = "3.13.0" # shfmtに相当する
"aqua:koalaman/shellcheck" = "0.11.0"
# microCMS
"npm:microcms-mcp-server"          = "0.8.0"

[settings]
jobs         = 20
experimental = true
lockfile     = true

[settings.node]
gpg_verify = false

[settings.npm]
bun = true

[settings.pipx]
uvx = true

[env]
NPM_CONFIG_REGISTRY = "https://npm.flatt.tech"
PIP_INDEX_URL       = "https://pypi.flatt.tech/simple/"
UV_INDEX_URL        = "https://pypi.flatt.tech/simple/"
HK_MISE = "1"
HK_PKL_BACKEND = "pklr"
CLAUDE_CODE_NO_FLICKER = "1"
EDITOR = "nvim"
