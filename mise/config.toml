[tools]
"aqua:cli/cli"               = "2.96.0"
"hk"                         = "1.51.0"
"aqua:jqlang/jq"             = "1.8.2"
"aqua:mikefarah/yq"          = "4.53.3"
"aqua:tamasfe/taplo"         = "0.10.0"
"aqua:junegunn/fzf"          = "0.74.1"
"aqua:sharkdp/fd"            = "10.4.2"
"aqua:sharkdp/bat"           = "0.26.1"
"aqua:BurntSushi/ripgrep"    = "15.2.0"
"aqua:dandavison/delta"      = "0.19.2"
"aqua:ajeetdsouza/zoxide"    = "0.10.0"
"aqua:sxyazi/yazi"           = "26.5.6"
"aqua:jesseduffield/lazygit" = "0.63.1"
"aqua:neovim/neovim"         = "0.12.4"
"aqua:ogulcancelik/herdr"    = "0.7.4"
"npm:hunkdiff"               = "0.17.1"
"aqua:dlvhdr/gh-dash"        = "4.25.2"
# AI
"npm:@openai/codex"             = "0.144.6"
"npm:@anthropic-ai/claude-code" = "2.1.214"
"npm:@google/gemini-cli"        = "0.34.0"
# Go
"go"                                   = "1.25.12"
"go:golang.org/x/tools/gopls"          = "0.23.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.1.4"
"aqua:golangci/golangci-lint"          = "2.12.2"
# Node.js
"node"                           = "24.18.0"
"bun"                            = "1.3.14"
"npm:typescript"                 = "5.9.3"
"npm:typescript-language-server" = "5.0.0"
"npm:@typescript/native-preview" = "7.0.0-dev.20260318.1"
"npm:@biomejs/biome"             = "2.5.4"
"npm:eas-cli"                    = "18.4.0"
# Python
"python" = "3.14.6"
"uv"     = "0.11.29"
# GitHub Actions
"aqua:rhysd/actionlint"        = "1.7.11"
"aqua:suzuki-shunsuke/ghalint" = "1.5.5"
"aqua:zizmorcore/zizmor"       = "1.27.0"
"aqua:suzuki-shunsuke/pinact"  = "3.4.5"
# ShellScript
"aqua:mvdan/sh"            = "3.13.0"
"aqua:koalaman/shellcheck" = "0.11.0"
# microCMS
"npm:microcms-mcp-server"          = "0.8.0"
"npm:microcms-document-mcp-server" = "0.2.5"

[settings]
jobs         = 20
experimental = true
lockfile     = true

[settings.node]
gpg_verify = false

[settings.npm]
bun = true

[settings.pipx]
uvx = true

[env]
NPM_CONFIG_REGISTRY    = "https://npm.flatt.tech"
BUN_CONFIG_REGISTRY    = "https://npm.flatt.tech"
PIP_INDEX_URL          = "https://pypi.flatt.tech/simple/"
UV_INDEX_URL           = "https://pypi.flatt.tech/simple/"
GOPROXY                = "https://golang.flatt.tech"
LANG                   = "ja_JP.UTF-8"
LC_ALL                 = "ja_JP.UTF-8"
HK_MISE                = "1"
HK_PKL_BACKEND         = "pklr"
CLAUDE_CODE_NO_FLICKER = "1"
EDITOR                 = "nvim"

[shell_alias]
m = "mise"
y = "yazi"
g = "lazygit"
h = "herdr"
d = "hunk diff"
